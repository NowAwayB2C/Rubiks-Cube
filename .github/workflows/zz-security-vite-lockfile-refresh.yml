name: Temporary Vite GHSA lockfile refresh
on:
  push:
    branches:
      - security/ghsa-p4f5-76q4-ffq7-vite-20261116
permissions:
  contents: write
jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[lockfile-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Refresh Bun lockfile
        run: bun install --lockfile-only
      - name: Install from updated lockfile
        run: bun install --frozen-lockfile
      - name: Build and focused validation
        run: |
          bun run build
          bun run lint
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): patch Vite GHSA-p4f5-76q4-ffq7 [lockfile-refresh]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
